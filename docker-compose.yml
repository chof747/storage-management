services:
  backend:
    image: ghcr.io/chof747/storagemanager_backend:test
    ports:
      - "8000:8000"
    volumes:
      - ./data/backend/:/data
    environment:
      - DATABASE_URL=sqlite:////data/test.db
      - PRINT_STRATEGIES_PATH=/data/print-strategies
      - PARTSBOX_BASE_URL=https://partsbox.com/api/1
      - PARTSBOX_API_KEY=partsboxapi_4k3kzyt54ak8c8vd15d32r2aq7cb4171d88aace8dbd6715acc8b41fab188755d
      - PARTSBOX_CACHE_EXPIRATION=1800
    networks:
      storage_manager:
        aliases:
          - storeman_backend

  frontend:
    image: ghcr.io/chof747/storagemanager_frontend:test
    volumes:
      - ./frontend/.env:/app/.env
      - ./frontend/public/config.json:/usr/share/nginx/html/config.json
    ports:
      - "3010:80"
    env_file:
      - ./frontend/.env
    networks:
      storage_manager:
        aliases:
          - storeman_frontend
networks:
  storage_manager:
