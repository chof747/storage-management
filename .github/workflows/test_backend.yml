name: Run Python Tests

on:
  pull_request:
    branches:
      - main
      - "release/**"
      
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Make the backend behave like in your docker-compose / local env
      PARTSBOX_BASE_URL: https://partsbox.com/api/1
      PARTSBOX_API_KEY: ${{ secrets.PARTSBOX_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install -G dev

      - name: Run tests
        working-directory: backend
        run: pdm run pytest
